[package]
name = "malgudi-pos-native"
version = "2.9.25"
edition = "2021"
description = "Native Rust SQLite database and transaction engine for Malgudi Mithais POS"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled", "backup", "uuid"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
uuid = { version = "1.8", features = ["v7", "serde"] }
thiserror = "1.0"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
tauri = { version = "2.0.0", features = [] }
ureq = { version = "2.9", default-features = false, features = ["tls", "json"] }
tauri-plugin-process = "2"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
